[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "python-for-data-science-42sp"
version = "1.0.0"
description = "42 São Paulo Python for Data Science Piscine modules and exercise automation"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Rogerio Silva", email = "rogerio_288@hotmail.com"}
]
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "numpy>=1.20.0",
    "pillow>=9.0.0",
    "matplotlib>=3.5.0",
    "pandas>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "flake8>=6.0.0",
    "black>=24.0.0",
    "isort>=5.10.0",
    "ruff>=0.1.0",
    "pre-commit>=3.0.0",
]

[tool.black]
line-length = 100
target-version = ['py310']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3

[tool.ruff]
target-version = "py310"
line-length = 100
select = ["E", "F", "W", "C90", "I"]
ignore = []

[tool.setuptools.packages.find]
where = ["."]
include = ["python_*", "tests*", "scripts*"]
